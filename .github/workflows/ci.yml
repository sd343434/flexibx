name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  # Manual runs (Actions tab → CI → Run workflow), e.g. after an account or billing fix:
  # docs/runbooks/CI_STATUS.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - name: Validate phase status file
        run: pnpm phase:validate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Pass 19: build-and-verify.sh refuses bad tags, a SHA tag that is not HEAD, a dirty
      # tree or an existing tag on --push, and pushes nothing unless every check passed.
      - name: Release script guards (stub Docker, no registry)
        run: scripts/release/test-release-guards.sh
      # Pass 20: the hosted-staging preflight (no AWS call, never plan/apply) refuses a
      # placeholder domain, a tracked variables file, an unpushed commit, a missing lock.
      - name: Staging preflight checks (stub Terraform, no AWS)
        run: scripts/release/test-staging-preflight.sh
      # Pass 22: the host writes staging.env from Secrets Manager only when every key is
      # present and real, mode 600, atomically, printing no value.
      - name: Staging env from the secret (stub AWS CLI)
        run: scripts/ops/test-render-staging-env.sh
      # Pass 23 (R-9 proposal): a pinned AWS CLI is installed only when its SHA-256 and
      # reported version are the pinned ones.
      - name: Pinned AWS CLI installer (stub download)
        run: scripts/ops/test-install-aws-cli-pinned.sh
      # Pass 24: a new AWS CLI pin is taken only from a signature by the current (not
      # expired, not revoked) AWS CLI team key — gpg's exit status alone accepts an expired one.
      - name: AWS CLI signature check (throwaway keys)
        run: scripts/ops/test-verify-aws-cli-signature.sh
      # Pass 16: the staging infrastructure (deploy/staging/aws) is formatted, valid and
      # passes its security tests against a mocked AWS provider — no credentials, no plan
      # against AWS, nothing created.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - name: Terraform fmt, validate and tests (staging, mocked provider)
        working-directory: deploy/staging/aws
        run: |
          terraform fmt -recursive -check
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  integration:
    name: Integration, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: flexibx
          POSTGRES_PASSWORD: flexibx
          POSTGRES_DB: flexibx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flexibx -d flexibx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the ephemeral service container.
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx?schema=public
      TEST_DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx_test?schema=public
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "postgresql://flexibx:flexibx@localhost:5432/flexibx" -c "CREATE DATABASE flexibx_test"
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm exec prisma migrate status
      # Pass 41: the migrated database must match schema.prisma exactly (no drift), as in
      # the local gates.
      - name: Schema drift (migrations vs schema.prisma)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Creator Studio integration tests cut and render real media with FFmpeg (libx264,
      # libass for burned-in subtitles) and a font for the subtitles.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pnpm test:integration
      # Backup → restore → verify with the real ops scripts on disposable databases on the
      # service container, including the cases that must fail (tampered dump or manifest,
      # missing index, a guard trigger switched off before the backup).
      - name: PostgreSQL client version (the drill needs pg_dump 16)
        run: pg_dump --version && pg_dump --version | grep -q " 16\."
      - name: Restore drill (disposable databases)
        env:
          DRILL_ADMIN_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx
        run: scripts/ops/restore-drill.sh
      # Pass 18: the drill must also FAIL — 13 deliberate defects (in a copy of scripts/ops,
      # or in the restored copy), each caught at its own step.
      - name: Restore drill mutation test
        env:
          DRILL_ADMIN_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx
        run: scripts/ops/restore-drill-mutants.sh
      - name: Creator Studio acceptance on a disposable S3-compatible bucket (Pass 12)
        run: scripts/staging/local-stack.sh
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The auth e2e tests need a session secret; a fresh random one per run, never stored.
      - name: Generate throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: flexibx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ops image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: flexibx-ops:ci
          cache-from: type=gha
      - name: Build Creator Studio worker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: flexibx-worker:ci
          cache-from: type=gha
      - name: Validate the staging Compose file (Pass 13)
        run: |
          cp deploy/staging/staging.env.example deploy/staging/staging.env
          cp deploy/staging/staging-owner.env.example deploy/staging/staging-owner.env
          FLEXIBX_TAG=ci docker compose -f deploy/staging/compose.yaml --profile jobs config --quiet
          # Without an explicit release tag the Compose file must refuse to render.
          if docker compose -f deploy/staging/compose.yaml config --quiet 2>/dev/null; then
            echo "compose accepted a missing FLEXIBX_TAG" >&2; exit 1
          fi
          # Pass 37: the owner login reaches migrate, backup and check only.
          FLEXIBX_TAG=ci scripts/staging/check-compose-credentials.sh
          rm deploy/staging/staging.env deploy/staging/staging-owner.env
      # Pass 18: every release check in one script, shared with scripts/release/build-and-verify.sh:
      # revision label = this commit; contents (non-root, no secrets/state/tests, no package
      # manager in the app image, /work and /backups writable); size budgets (measured 389 /
      # 1229 / 1088 MB, Pass 17); ops self-check; worker media tools and PostgreSQL 16 client;
      # vulnerability scan (Trivy pinned by digest; fails on a fixable HIGH/CRITICAL).
      - name: Verify release images
        run: scripts/release/verify-images.sh flexibx:ci flexibx-worker:ci flexibx-ops:ci "${{ github.sha }}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
