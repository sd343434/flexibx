name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: flexibx
          POSTGRES_PASSWORD: flexibx
          POSTGRES_DB: flexibx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flexibx -d flexibx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the ephemeral service container.
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx?schema=public
      TEST_DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx_test?schema=public
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "postgresql://flexibx:flexibx@localhost:5432/flexibx" -c "CREATE DATABASE flexibx_test"
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm exec prisma migrate status
      - run: pnpm test:integration
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: flexibx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
