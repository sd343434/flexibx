name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  # Manual runs (Actions tab → CI → Run workflow), e.g. after an account or billing fix:
  # docs/runbooks/CI_STATUS.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - name: Validate phase status file
        run: pnpm phase:validate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: flexibx
          POSTGRES_PASSWORD: flexibx
          POSTGRES_DB: flexibx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flexibx -d flexibx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway credentials for the ephemeral service container.
      APP_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx?schema=public
      TEST_DATABASE_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx_test?schema=public
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql "postgresql://flexibx:flexibx@localhost:5432/flexibx" -c "CREATE DATABASE flexibx_test"
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Verify migration status
        run: pnpm exec prisma migrate status
      # Creator Studio integration tests cut and render real media with FFmpeg (libx264,
      # libass for burned-in subtitles) and a font for the subtitles.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pnpm test:integration
      # Backup → restore → verify with the real ops scripts on disposable databases on the
      # service container, including the cases that must fail (tampered dump or manifest,
      # missing index, a guard trigger switched off before the backup).
      - name: PostgreSQL client version (the drill needs pg_dump 16)
        run: pg_dump --version && pg_dump --version | grep -q " 16\."
      - name: Restore drill (disposable databases)
        env:
          DRILL_ADMIN_URL: postgresql://flexibx:flexibx@localhost:5432/flexibx
        run: scripts/ops/restore-drill.sh
      - name: Creator Studio acceptance on a disposable S3-compatible bucket (Pass 12)
        run: scripts/staging/local-stack.sh
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # The auth e2e tests need a session secret; a fresh random one per run, never stored.
      - name: Generate throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build app image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: flexibx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build ops image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: false
          load: true
          tags: flexibx-ops:ci
          cache-from: type=gha
      - name: Build Creator Studio worker image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: flexibx-worker:ci
          cache-from: type=gha
      # FFmpeg in the worker image: the version, encoders and subtitle filter the worker
      # needs (offline; no credentials, no storage, no provider).
      # The image build already ran this check (it fails the build); run it again on the
      # final image as the worker's user, offline, and prove the worker is not root.
      - name: Check worker image media tools and user (offline)
        run: |
          docker run --rm --network none flexibx-worker:ci sh scripts/creator/check-media-tools.sh
          uid="$(docker run --rm --network none flexibx-worker:ci id -u)"
          echo "worker runs as uid $uid"
          test "$uid" != "0"
          # The staging gate (pnpm staging:check) runs in this image: its database check
          # needs the PostgreSQL 16 client.
          docker run --rm --network none flexibx-worker:ci psql --version | grep -q " 16\."
      - name: Validate the staging Compose file (Pass 13)
        run: |
          cp deploy/staging/staging.env.example deploy/staging/staging.env
          docker compose -f deploy/staging/compose.yaml --profile jobs config --quiet
          rm deploy/staging/staging.env
      - name: Check ops image (offline, no credentials)
        run: |
          docker run --rm --network none --entrypoint bash \
            -e COREPACK_ENABLE_NETWORK=0 flexibx-ops:ci scripts/ops/check-ops-image.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
