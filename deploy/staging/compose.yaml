# Flexibx staging on one Docker host (Pass 13). docs/runbooks/STAGING_CREATOR_STUDIO.md § 3.
#
# What runs here: the web app, the Creator Studio worker, and a scheduler; plus one-off
# jobs (migrate, check, backup) under the `jobs` profile. What does NOT run here, by design:
# PostgreSQL, the S3-compatible bucket and the alert destination — managed, private
# services the owner provides (never the production ones), reached through the URLs in
# staging.env. The same five services map one-to-one onto any container platform.
#
#   cp deploy/staging/staging.env.example deploy/staging/staging.env   # fill in; never commit
#   docker compose -f deploy/staging/compose.yaml build
#   export FLEXIBX_TAG=<release>   # required: an immutable tag (e.g. the commit), never "latest"
#   docker compose -f deploy/staging/compose.yaml run --rm migrate      # once per release
#   docker compose -f deploy/staging/compose.yaml up -d app worker scheduler
#   docker compose -f deploy/staging/compose.yaml run --rm check        # must say PASSED
#
# Secrets come only from staging.env at run time: none is in an image, a build argument
# or this file. The app listens on 127.0.0.1 only: put the host's TLS proxy in front.

name: flexibx-staging

x-env: &env
  env_file:
    - path: staging.env
      required: true

# The owner login of the database (staging-owner.env: OWNER_DATABASE_URL, Pass 37) reaches
# only the one-off jobs that need it — migrate, backup and the gate's db-verify — never the
# app, the worker or the scheduler, which run as the runtime login (DATABASE_URL). Once
# scripts/ops/sql/db-roles.sql is applied, that login cannot run migrations, cannot dump the
# database and cannot read _prisma_migrations (docs/runbooks/DATABASE_ROLES.md § 5).
x-owner-env: &owner-env
  env_file:
    - path: staging.env
      required: true
    - path: staging-owner.env
      required: true

# Container logs rotate (5 × 10 MB per service): a long-running host never fills its disk
# with logs. The platform's log shipping, if any, reads them before rotation.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-build: &build
  context: ../..
  dockerfile: Dockerfile

services:
  app:
    <<: [*env, *logging]
    image: ${FLEXIBX_REGISTRY:-flexibx}/app:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    build: { <<: *build, target: runner }
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLEXIBX_APP_PORT:-3000}:3000"
    # The image's HEALTHCHECK probes liveness; readiness (database) is /api/health.
    stop_grace_period: 20s

  worker:
    <<: [*env, *logging]
    image: ${FLEXIBX_REGISTRY:-flexibx}/worker:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    build: { <<: *build, target: worker }
    restart: unless-stopped
    # SIGTERM reaches node (PID 1): the job in progress is handed back within seconds.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    volumes:
      # Scratch space: about 3x the largest allowed source (CREATOR_MAX_UPLOAD_MB).
      - work:/work

  scheduler:
    <<: [*env, *logging]
    image: ${FLEXIBX_REGISTRY:-flexibx}/ops:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    build: { <<: *build, target: ops }
    restart: unless-stopped
    environment:
      SCHEDULER_APP_URL: http://app:3000
    command: ["node", "--import", "tsx", "scripts/ops/scheduler.ts"]
    depends_on:
      app:
        condition: service_healthy

  # ── One-off jobs (`docker compose run --rm <job>`) ──────────────────────────────
  migrate:
    <<: *owner-env
    image: ${FLEXIBX_REGISTRY:-flexibx}/ops:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    profiles: [jobs]
    # As the owner login; refuses unless the database is marked staging
    # (scripts/ops/db-environment.sh).
    entrypoint: ["bash", "-c"]
    command:
      [
        'export DATABASE_URL="$${OWNER_DATABASE_URL:?OWNER_DATABASE_URL is not set (staging-owner.env)}" && scripts/ops/db-environment.sh assert staging && exec node_modules/.bin/prisma migrate deploy',
      ]

  check:
    <<: *owner-env
    image: ${FLEXIBX_REGISTRY:-flexibx}/worker:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    profiles: [jobs]
    environment:
      # The gate reaches the app the way the worker does, inside this network.
      STAGING_CHECK_APP_URL: http://app:3000
    # `pnpm staging:check --send-test-alert` without pnpm (not in the image): node runs it.
    command:
      [
        "node",
        "--import",
        "tsx",
        "--import",
        "./scripts/video-retention/register.mjs",
        "scripts/staging/check.ts",
        "--send-test-alert",
      ]
    volumes:
      - work:/work

  backup:
    <<: *owner-env
    image: ${FLEXIBX_REGISTRY:-flexibx}/ops:${FLEXIBX_TAG:?set FLEXIBX_TAG to the release tag being deployed}
    profiles: [jobs]
    entrypoint: ["bash", "-c"]
    # Writes the dump, its manifest and checksums to the `backups` volume; copy them off
    # the host (BACKUP_RESTORE.md). Restores go to a NEW database (db-restore.sh).
    command:
      [
        'BACKUP_DATABASE_URL="$${OWNER_DATABASE_URL:?OWNER_DATABASE_URL is not set (staging-owner.env)}" scripts/ops/db-backup.sh /backups/staging',
      ]
    volumes:
      - backups:/backups

volumes:
  work:
  backups:
